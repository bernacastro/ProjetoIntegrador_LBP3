{% extends 'core/base.html' %}

{% block title %}Confirmar exclusão{% endblock %}

{% block content %}

<h2>Confirmar exclusão</h2>

<p>
    Tem certeza que deseja excluir {{ tipo }}:
    <strong>{{ objeto }}</strong>?
</p>

<form method="post">
    {% csrf_token %}
    
    <button type="submit" style="background-color: #dc3545; border-color: #dc3545;">Sim, excluir</button>

    <a href="{% url url_cancelar %}" class="button" style="background-color: #6c757d; border-color: #6c757d;">Cancelar</a>
</form>

{% endblock %}
