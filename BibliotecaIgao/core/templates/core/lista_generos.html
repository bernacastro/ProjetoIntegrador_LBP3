{% extends 'core/base.html' %}

{% block title %}Categorias{% endblock %}

{% block content %}
<h2>Categorias</h2>
<p><a class="button" href="{% url 'editar' 'categoria' 0 %}">Nova categoria</a></p>

<div class="tabela-wrap">
    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for categoria in categorias %}
            <tr>
                <td><strong>{{ categoria.nome }}</strong></td>
                <td class="acoes">
                    <a href="{% url 'editar' 'categoria' categoria.pk %}" class="button">Editar</a>
                    <a href="{% url 'excluir' 'categoria' categoria.pk %}" class="button">Excluir</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="2">Nenhuma categoria cadastrada.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
