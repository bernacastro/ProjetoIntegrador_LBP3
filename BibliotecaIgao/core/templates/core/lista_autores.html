{% extends 'core/base.html' %}

{% block title %}Autores{% endblock %}

{% block content %}
<h2>Autores</h2>
<a class="button" href="{% url 'editar' 'autor' 0 %}">Novo autor</a>
<ul>
    {% for autor in autores %}
    <li>
        <strong>{{ autor.nome }}</strong> — {{ autor.nacionalidade }}
        <a href="{% url 'editar' 'autor' autor.pk %}">Editar</a>
        <a href="{% url 'excluir' 'autor' autor.pk %}">Excluir</a>
    </li>
    {% empty %}
    <li>Nenhum autor cadastrado.</li>
    {% endfor %}
</ul>
{% endblock %}
